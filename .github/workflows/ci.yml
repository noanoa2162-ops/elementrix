name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Compile browser JavaScript
        run: npm run build

      - name: Verify generated JavaScript is committed
        run: git diff --exit-code -- js

      - name: Run tests
        run: npm test
