<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר - Elementrix</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/info-pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="contact-container">
        <a href="store.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            חזרה לחנות
        </a>

        <div class="contact-header">
            <h1><i class="fas fa-envelope"></i> צור קשר</h1>
            <p>יש לך שאלה או הצעה? נשמח לשמוע ממך!</p>
        </div>

        <form class="contact-form">
            <div class="form-group">
                <label for="name">שם מלא</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">אימייל</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="subject">נושא</label>
                <input type="text" id="subject" required>
            </div>

            <div class="form-group">
                <label for="message">הודעה</label>
                <textarea id="message" rows="6" required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-paper-plane"></i> שלח הודעה
            </button>
        </form>
    </div>
</body>
</html>
