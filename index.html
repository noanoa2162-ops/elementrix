<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementrix - הפלטפורמה המובילה לרכיבי קוד</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/advanced-effects.css">
    <link rel="stylesheet" href="css/no-loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <!-- Animated Background -->
    <div class="hero-background">
        <div class="animated-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <h1 class="logo">Elementrix</h1>
            <p class="tagline">הפלטפורמה המובילה לרכיבי קוד מקצועיים</p>
            
            <!-- 🎮 Gamification Banner -->
            <div class="auth-stats gamification-banner">
                <div class="stat-item animate-on-hover">
                    <i class="fas fa-code-branch pulse-icon"></i>
                    <div>
                        <strong class="counter" data-target="1200">1200</strong><strong>+</strong>
                        <span> רכיבי קוד</span>
                    </div>
                </div>
                <div class="stat-item animate-on-hover">
                    <i class="fas fa-users pulse-icon"></i>
                    <div>
                        <strong class="counter" data-target="500">500</strong><strong>+</strong>
                        <span> מפתחים</span>
                    </div>
                </div>
                <div class="stat-item animate-on-hover">
                    <i class="fas fa-star pulse-icon"></i>
                    <div>
                        <strong class="counter" data-target="4.9">4.9</strong><strong>/5</strong>
                        <span> דירוג</span>
                    </div>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" id="loginTab">כניסה</button>
                <button class="tab-btn" id="registerTab">הרשמה</button>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginUsername">שם משתמש או אימייל</label>
                    <input type="text" id="loginUsername" name="username" required>
                    <span class="error-msg" id="loginUsernameError"></span>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">סיסמה</label>
                    <input type="password" id="loginPassword" name="password" required>
                    <span class="error-msg" id="loginPasswordError"></span>
                </div>
                
                <button type="submit" class="btn btn-primary">כניסה</button>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label for="registerUsername">שם משתמש</label>
                    <input type="text" id="registerUsername" name="username" required>
                    <span class="error-msg" id="registerUsernameError"></span>
                    <span class="hint">2-20 תווים, עברית/אנגלית, מספרים ורווחים</span>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">אימייל</label>
                    <input type="email" id="registerEmail" name="email" required>
                    <span class="error-msg" id="registerEmailError"></span>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">סיסמה</label>
                    <input type="password" id="registerPassword" name="password" required>
                    <span class="error-msg" id="registerPasswordError"></span>
                    <span class="hint">לפחות 8 תווים, אות גדולה, אות קטנה, מספר ותו מיוחד</span>
                </div>
                
                <div class="form-group">
                    <label for="registerPasswordConfirm">אימות סיסמה</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required>
                    <span class="error-msg" id="registerPasswordConfirmError"></span>
                </div>
                
                <button type="submit" class="btn btn-primary">הרשמה</button>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="auth-footer">
            <p>© 2024 חנות רכיבי קוד - כל הזכויות שמורות</p>
            <div class="footer-links">
                <a href="#"><i class="fas fa-shield-alt"></i> מדיניות פרטיות</a>
                <a href="#"><i class="fas fa-file-contract"></i> תנאי שימוש</a>
                <a href="#"><i class="fas fa-envelope"></i> צור קשר</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/types.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/advanced-effects.js"></script>
</body>
</html>
